########################################################################
# ldap-scripts.conf - Configuration du site
#
# Ce fichier ne contient que ce que tu veux changer : tout paramètre laissé
# en commentaire garde la valeur par défaut livrée dans lib/defaults.sh.
# La liste complète, avec les valeurs possibles, est dans CONFIGURATION.md
# ou via la commande :  ldapconfig show --all
#
# Priorité : defaults.sh < ce fichier < conf.d/*.conf < ~/.config/... <
#            $LDAP_SCRIPTS_CONF < variables d'environnement < -o NOM=VALEUR
########################################################################

# ======================================================================
# 1. Annuaire  (le strict minimum à renseigner)
# ======================================================================
BASE_DN="dc=example,dc=com"
LDAP_URI="ldap://ldap.example.com"

# Branches. Par défaut : ou=people,<BASE_DN> et ou=groups,<BASE_DN>
#USERS_RDN="ou=people"
#GROUPS_RDN="ou=groups"
#USERS_DN="ou=users,dc=example,dc=com"
#GROUPS_DN="ou=groups,dc=example,dc=com"

# ======================================================================
# 2. Authentification au serveur
#    prompt (défaut) | password | file | env | sasl | none
# ======================================================================
LDAP_AUTH="prompt"
BIND_DN="cn=admin,${BASE_DN}"

# Sans saisie interactive, au choix :
#LDAP_AUTH="file"      ; LDAP_BIND_PASSWORD_FILE="/etc/ldap-scripts/bind.secret"
#LDAP_AUTH="env"       ; LDAP_BIND_PASSWORD_ENV="LDAP_BIND_PW"
#LDAP_AUTH="sasl"      ; LDAP_SASL_MECH="EXTERNAL" ; LDAP_URI="ldapi:///"

# Chiffrement : none | starttls | ldaps
#LDAP_TLS="starttls"
#LDAP_TLS_CACERT="/etc/ssl/certs/ca.pem"
#LDAP_TLS_REQCERT="demand"

# ======================================================================
# 3. Comptes POSIX
# ======================================================================
#UID_MIN=10000
#UID_MAX=60000
#UID_ALLOCATION="max"          # max | first
#DEFAULT_SHELL="/bin/bash"
#CN_PATTERN="%f %l"            # %f prénom, %l nom, %u login
#MAIL_PATTERN="%u@%d"          # vide = pas d'attribut mail
#MAIL_DOMAIN="example.com"     # vide = déduit de BASE_DN

# Attributs et classes supplémentaires injectés dans chaque compte
#USER_EXTRA_OBJECTCLASSES="ldapPublicKey"
#USER_EXTRA_ATTRS="o=Example Corp;departmentNumber=IT"

# ======================================================================
# 4. Groupes
#    per-user (un groupe par compte) | shared | none
# ======================================================================
#GROUP_MODE="per-user"
#DEFAULT_GROUP="users"
#DEFAULT_GID=10000

# ======================================================================
# 5. Mot de passe stocké dans l'annuaire
#    sasl (délégué à Kerberos) | hash (slappasswd) | none
# ======================================================================
USER_PASSWORD_MODE="hash"
#USER_PASSWORD_HASH="{SSHA}"
#USER_PASSWORD_INITIAL="prompt"   # prompt | random

# ======================================================================
# 6. Kerberos  (laisse KRB5_ENABLED=0 si tu n'as pas de KDC)
# ======================================================================
KRB5_ENABLED=0
#KRB5_REALM="EXAMPLE.COM"          # vide = BASE_DN en majuscules
#KRB5_ADMIN_CMD="kadmin.local"     # ou : kadmin -p admin/admin
#KRB5_ADDPRINC_OPTS="-policy users"
#KRB5_PASSWORD_MODE="prompt"       # prompt | random
#KRB5_REQUIRED=0                   # 1 = annule la création si le KDC échoue

# ======================================================================
# 7. Répertoires personnels
# ======================================================================
#HOME_ENABLED=1
#HOME_ROOT="/home"                 # emplacement réel sur cette machine
#HOME_LOGICAL_ROOT="/home"         # valeur écrite dans homeDirectory
#HOME_PATTERN="%u"                 # ex: "%i/%u" pour /home/j/jdupont
#HOME_MODE="0700"
#HOME_SKEL="/etc/skel"

# ======================================================================
# 8. Suppression de compte
# ======================================================================
#DELETE_HOME_ACTION="archive"      # archive | purge | keep
#ARCHIVE_DIR="/var/backups/ldap-scripts"
#ARCHIVE_FORMAT="move"             # move | tar
#DELETE_CONFIRM=1

# ======================================================================
# 9. Intégrations
# ======================================================================
#NSS_CHECK=1
#CACHE_FLUSH_CMD="sss_cache -E"
#HOOK_POST_ADD='echo "$LS_USERNAME cree" | mail -s "Nouveau compte" admin@example.com'
#HOOK_POST_DELETE=""
